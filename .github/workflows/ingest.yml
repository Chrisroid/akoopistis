name: Cloud Sermon Ingestion

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of sermons to ingest in this run"
        required: true
        default: "50"
        type: string
  schedule:
    # Autonomous batch execution: runs every 3 hours to ingest in batches of 50
    - cron: "0 */3 * * *"

permissions:
  contents: write
  actions: write

jobs:
  ingest:
    name: Ingest & Speech-Normalize Sermons
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg & System Audio Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stage YouTube Authentication
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf "%s\n" "$YOUTUBE_COOKIES" > cookies.txt
            echo "Cookie authentication staged successfully ($(wc -l < cookies.txt) lines)."
          fi

      - name: Run Cloud Ingestion Engine
        id: ingest
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL_PREFIX: ${{ secrets.R2_PUBLIC_URL_PREFIX }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          BATCH="${{ github.event.inputs.batch_size }}"
          if [ -z "$BATCH" ]; then
            BATCH="50"
          fi
          echo "=========================================="
          echo "Launching Cloud Ingestion for $BATCH sermons"
          echo "=========================================="
          python scripts/bulk_ingest.py --count "$BATCH"

      - name: Clean Temporary Secrets
        if: always()
        run: |
          rm -f cookies.txt

      - name: Commit and Push Catalog Updates
        run: |
          git config --global user.name "Christian Asarhasa"
          git config --global user.email "56808916+Chrisroid@users.noreply.github.com"
          git add data/sermons.json data/bulk_state.json
          if git diff --staged --quiet; then
            echo "No new sermons to commit."
          else
            COUNT="${{ steps.ingest.outputs.ingested }}"
            if [ -z "$COUNT" ]; then
              COUNT="50"
            fi
            git commit -m "feat(catalog): cloud ingest $COUNT sermons via GitHub Actions"
            git push origin main
          fi

      - name: Trigger Next Batch
        if: success() && steps.ingest.outputs.remaining > 0 && steps.ingest.outputs.ingested > 0
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "Remaining eligible sermons: ${{ steps.ingest.outputs.remaining }}"
          echo "Attempting autonomous workflow dispatch for next batch..."
          gh workflow run ingest.yml --ref main -f batch_size=50 || echo "Self-dispatch note: A personal access token (PAT_TOKEN) enables instant chaining. Scheduled cron (every 3 hours) will pick up the next 50-sermon batch automatically."
